[project]
name = "telegram-music-bot"
version = "0.1.0"
description = "Telegram Voice Chat Music Player - Search, stream, and manage music in voice chats"
requires-python = ">=3.11"

[project.dependencies]
pydantic = "~=2.3"
pydantic-settings = "~=2.3"
pyrogrammod = "~=2.4"
py-tgcalls = "~=2.3"
sqlalchemy = "~=2.0"
asyncpg = "~=0.28"
aiosqlite = "*"
alembic = "~=1.10"
httpx = "~=0.25"
requests = "*"
redis = ">=5.0,<6.0"
structlog = "~=24.0"
yt-dlp = "*"
prometheus-client = "*"

[project.optional-dependencies]
dev = [
    "pytest~=7.0",
    "pytest-asyncio~=0.21",
    "pytest-cov~=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pydantic~=2.3",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "UP", "SIM"]
"scripts/*" = ["B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (e.g. Docker/Redis)",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
