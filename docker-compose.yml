services:
  bot:
    build: .
    # Secrets come from the shell/.env; explicit ``environment`` (not env_file)
    # so every variable is visible and BOT_TOKEN is required at startup.
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env or the shell}
      API_ID: ${API_ID:-}
      API_HASH: ${API_HASH:-}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/telegram_music
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BOT_OWNER_ID: ${BOT_OWNER_ID:-}
      LYRICS_API_BASE: ${LYRICS_API_BASE:-}
      METRICS_PORT: ${METRICS_PORT:-9090}
      QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-200}
      QUEUE_MAX_AGE_SECONDS: ${QUEUE_MAX_AGE_SECONDS:-86400}
      PLAY_MAX_RETRIES: ${PLAY_MAX_RETRIES:-2}
      USERBOT_SESSION: ${USERBOT_SESSION:-}
      USERBOT_SESSION_STRING: ${USERBOT_SESSION_STRING:-}
      USERBOT_API_ID: ${USERBOT_API_ID:-}
      USERBOT_API_HASH: ${USERBOT_API_HASH:-}
    ports:
      # Prometheus metrics endpoint. Set METRICS_PORT=0 to publish nothing.
      - "${METRICS_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_music
    # 5433 avoids clashing with a native Postgres on host port 5432
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telegram_music"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: